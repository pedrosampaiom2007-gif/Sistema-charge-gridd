services:
  # API (Flask) — sobe pra este blueprint dar deploy no serviço junto com o front-end,
  # com uma conta só e um clique só ("New +" > "Blueprint" no dashboard do Render).
  - type: web
    name: chargegrid-api
    runtime: python
    plan: free
    rootDir: entregas/files
    buildCommand: pip install -r "../requirements (1).txt"
    # --workers 1 (estado ao vivo mora na memória de UM processo só, ver
    # Procfile) + --threads 4 --worker-class gthread (sem isso, o worker sync
    # padrão só atende 1 requisição HTTP por vez — com 3 telas fazendo
    # polling e o /api/chat esperando a LLM, uma chamada lenta travava as
    # demais; medido localmente antes desta mudança).
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread api_server:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: CORS_ORIGINS
        value: "https://chargegrid-web.onrender.com"

  # As 3 telas (totem, app, dashboard) + landing page — arquivos estáticos,
  # sem servidor Python nenhum, publicados como estão em entregas/.
  - type: web
    name: chargegrid-web
    runtime: static
    rootDir: entregas
    staticPublishPath: .

# Nomes previstos: https://chargegrid-api.onrender.com e
# https://chargegrid-web.onrender.com. Se algum desses nomes já estiver em
# uso por outra pessoa no Render (é global), o Render sugere um nome
# parecido na hora do deploy — nesse caso, atualize API_BASE (nos 3 app.js)
# e CORS_ORIGINS (acima) pra bater com a URL real gerada.
