<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChargeGrid Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #0a0e14;
    --panel: #10161d;
    --panel-raised: #161d26;
    --line: #1c2530;
    --line-bright: #2e3b48;
    --ink: #e7edf3;
    --muted: #7c8a99;
    --amber: #f5a524;
    --amber-dim: #7a5316;
    --cyan: #3fd0c9;
    --cyan-dim: #1d5f5a;

    --font-display: "Space Grotesk", sans-serif;
    --font-body: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font-body);
    height: 100%;
  }

  body {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .card {
    text-align: center;
    max-width: 480px;
    padding: 40px 32px;
  }

  .mark {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 0 3px var(--cyan-dim);
    margin: 0 auto 18px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }

  .sub {
    font-size: 13px;
    color: var(--muted);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 40px;
  }

  .opcoes {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .opcao {
    display: block;
    text-decoration: none;
    background: var(--panel);
    border: 1px solid var(--line-bright);
    padding: 20px 22px;
    text-align: left;
    transition: border-color .15s ease;
  }

  .opcao:hover { border-color: var(--cyan); }

  .opcao .titulo {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .opcao .desc {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .opcao.admin .titulo { color: var(--amber); }
</style>
</head>
<body>
<div class="card">
  <div class="mark" aria-hidden="true"></div>
  <h1>ChargeGrid Intelligence</h1>
  <div class="sub">EV Challenge 2026 — GoodWe</div>

  <div class="opcoes">
    <a class="opcao" href="files/index.html">
      <div class="titulo">Sou motorista</div>
      <div class="desc">Iniciar ou encerrar uma recarga (totem)</div>
    </a>
    <a class="opcao admin" href="frontend/index.html">
      <div class="titulo">Sou administrador</div>
      <div class="desc">Painel operacional — requer login</div>
    </a>
  </div>
</div>
</body>
</html>
